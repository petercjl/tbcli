name: Package QA
on: [push, pull_request, workflow_dispatch]
jobs:
  qa:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --ignore-scripts
      - run: npm test
      - name: Published updater and recovery matrix
        run: node --test test/upgrade-contract.test.mjs
        timeout-minutes: 8
        env:
          TBCLI_UPGRADE_QA: '1'
          AGENT_PACKAGE_UPDATE_CHECK: '0'
          TBCLI_UPDATE_CHECK: '0'
      - run: npm pack --dry-run
